# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: true
  path_filters:
    - "!.agents/**"
    - "!.claude/**"
    # .ai: keep the specs, the review checklist and the hand-written guides (contracts,
    # architecture, backend UI) reviewable; skip generated facts and harness tooling.
    - "!.ai/agentic.config.json"
    - "!.ai/harness/**"
    - "!.ai/skills/**"
    - "!.ai/lessons/**"
    - "!.ai/qa/**"
    - "!.ai/trackers/**"
    - "!.ai/guides/modules/**"
    - "!.ai/guides/reference-modules/**"
    - "!.ai/guides/*.json"
    # docs: DECISIONS.md and UPSTREAM_DIVERGENCES.md are review context (path instructions cite them).
    - "!docs/LOCAL_EMAIL.md"
    - "!yarn.lock"
    # Generated/baseline/progress/licence files checked separately; keep this full review within 150 files.
    - "!.ai/runs/2026-10-25-storefront-shopping-journey.md"
    - "!.ds-check-ignore"
    - "!src/modules/storefront/migrations/.snapshot-open-mercato.json"
    - "!THIRD_PARTY_NOTICES.md"
    - "!third_party/licenses/ecomcn-LICENSE.txt"
    # Temporary batch A: UI and style files are reviewed in the second full-review pass.
    - "!src/components/GlobalNoticeBars.tsx"
    - "!src/components/ecomcn/__tests__/product-buy-box.test.tsx"
    - "!src/components/ecomcn/address-form.tsx"
    - "!src/components/ecomcn/cart-line-item.tsx"
    - "!src/components/ecomcn/cart-sheet.tsx"
    - "!src/components/ecomcn/category-rail.tsx"
    - "!src/components/ecomcn/checkout-stepper.tsx"
    - "!src/components/ecomcn/delivery-options.tsx"
    - "!src/components/ecomcn/empty-results.tsx"
    - "!src/components/ecomcn/filter-panel.tsx"
    - "!src/components/ecomcn/filter-sheet.tsx"
    - "!src/components/ecomcn/order-confirmation.tsx"
    - "!src/components/ecomcn/payment-selector.tsx"
    - "!src/components/ecomcn/price-tag.tsx"
    - "!src/components/ecomcn/product-buy-box.tsx"
    - "!src/components/ecomcn/product-card.tsx"
    - "!src/components/ecomcn/product-gallery.tsx"
    - "!src/components/ecomcn/product-grid.tsx"
    - "!src/components/ecomcn/sort-toolbar.tsx"
    - "!src/components/ecomcn/variant-swatches.tsx"
    - "!src/components/ui/alert.tsx"
    - "!src/components/ui/badge.tsx"
    - "!src/components/ui/carousel.tsx"
    - "!src/components/ui/collapsible.tsx"
    - "!src/components/ui/combobox.tsx"
    - "!src/components/ui/dialog.tsx"
    - "!src/components/ui/field.tsx"
    - "!src/components/ui/input-group.tsx"
    - "!src/components/ui/pagination.tsx"
    - "!src/components/ui/portal-container.tsx"
    - "!src/components/ui/radio-group.tsx"
    - "!src/components/ui/separator.tsx"
    - "!src/components/ui/sheet.tsx"
    - "!src/components/ui/skeleton.tsx"
    - "!src/components/ui/slider.tsx"
    - "!src/components/ui/switch.tsx"
    - "!src/components/ui/textarea.tsx"
    - "!src/components/ui/toggle.tsx"
    - "!src/hooks/use-filter-params.ts"
    - "!src/lib/__tests__/digits.test.ts"
    - "!src/lib/address-format.ts"
    - "!src/lib/digits.ts"
    - "!src/lib/filter-params.ts"
    - "!src/lib/utils.ts"
    - "!src/modules/storefront/components/builder/BuilderPreview.tsx"
    - "!src/modules/storefront/components/builder/PageBuilder.tsx"
    - "!src/modules/storefront/components/builder/__tests__/adapter.test.tsx"
    - "!src/modules/storefront/components/builder/usePreviewSectionData.ts"
    - "!src/app/globals.css"
    - "!src/modules/storefront/lib/storefrontCss.ts"
  path_instructions:
    - path: "src/modules/storefront/**"
      instructions: |
        Enforce tenant isolation: derive trusted tenant_id and organization_id from
        authenticated scope, or from the resolved site row on public routes.
        Every dependent query must stay pinned to that scope; foreign IDs must
        behave identically to random IDs. Never render merchant HTML, CSS,
        className, style, scripts or arbitrary attributes. Validate saved,
        published and rendered specs using the canonical strict block schemas.
        Buyer-facing routes and client components must never import a client spec
        renderer (@json-render/react, @json-render/next), directly or transitively;
        @json-render/core is allowed in server code only (docs/DECISIONS.md S1/S2).
        Section references (attachment, product, category ids) must be checked against
        the caller's organization on save/publish/rollback; products and images are
        public only while a published section shows them.
        Check publish/rollback/undo ordering, row-lock rechecks, slug freeze,
        immutable revisions and the 30-page cap.
    - path: "src/app/**"
      instructions: |
        Public routes must never import a client spec renderer (@json-render/react,
        @json-render/next), directly or transitively, or preload a heavy admin editor chunk. Check metadata uniqueness,
        published-revision-only reads, no-store behavior and fail-closed rendering.
